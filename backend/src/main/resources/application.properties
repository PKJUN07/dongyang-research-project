spring.application.name=research-board-backend
server.address=127.0.0.1
server.port=8080

# Connections and versioned migrations are explicitly managed by Database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
research.db-path=${RESEARCH_DB_PATH:data/research-board.db}
research.provider=${RESEARCH_PROVIDER:fake}
research.serper-key=${SERPER_API_KEY:}
research.external-search-approved=${EXTERNAL_SEARCH_APPROVED:false}
# Cumulative attempts across restarts. Retries are disabled; one page, <=10 results.
research.max-provider-attempts=${MAX_PROVIDER_ATTEMPTS:2}
# Empty by default: no public page requests until a reviewed policy is supplied.
research.source-policy=${SOURCE_POLICY_PATH:}
