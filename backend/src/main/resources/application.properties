spring.application.name=research-board-backend
server.address=127.0.0.1
server.port=8080

# Connections and versioned migrations are explicitly managed by Database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
research.db-path=${RESEARCH_DB_PATH:data/research-board.db}
research.provider=${RESEARCH_PROVIDER:serper}
research.serper-key=${SERPER_API_KEY:}
research.external-search-approved=${EXTERNAL_SEARCH_APPROVED:false}
# Daily (Asia/Seoul) Serper call quota. Each result page and each body scrape uses one call.
research.max-provider-attempts=${MAX_PROVIDER_ATTEMPTS:200}
# Result pages fetched per search (10 results per page, 1..5).
research.serper-pages=${SERPER_PAGES:5}
# Fall back to Serper scrape when a page is not in the reviewed source policy.
research.serper-scrape-enabled=${SERPER_SCRAPE_ENABLED:true}
# Empty by default: no public page requests until a reviewed policy is supplied.
research.source-policy=${SOURCE_POLICY_PATH:}
# Directly fetch public pages that are not in the policy when their robots.txt allows it (free; tried before Serper scrape).
research.public-fetch-enabled=${PUBLIC_FETCH_ENABLED:true}
# During a search, automatically Serper-scrape up to this many top results that still have no body (each uses one call).
research.serper-scrape-per-search=${SERPER_SCRAPE_PER_SEARCH:50}
